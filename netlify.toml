[build]
  publish = "app"

# ── SPA redirect: /admin/* → index.html (maneja rutas y hash tokens) ──────────
# Netlify sirve "app/" como raíz, por lo que la URL pública es /admin/
# (sin el prefijo /app/ que existe en el filesystem local)
[[redirects]]
  from   = "/admin/*"
  to     = "/admin/index.html"
  status = 200

# ── Página 404 personalizada ────────────────────────────────────────────────────
# Debe ir DESPUÉS de las redirecciones específicas (Netlify usa first-match).
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
