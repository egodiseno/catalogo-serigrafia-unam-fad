[build]
  command = "next build"
  publish = ".next"

# Plugin de Netlify para Next.js — habilita SSR, ISR y Route Handlers
# Netlify lo instala automáticamente durante el build de CI
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variables de entorno requeridas en Netlify UI:
# NEXT_PUBLIC_SUPABASE_URL
# NEXT_PUBLIC_SUPABASE_ANON_KEY
