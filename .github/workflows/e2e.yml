# .github/workflows/e2e.yml — CI: Suite E2E con Playwright
#
# Catálogo de Obra Serigráfica — FAD / UNAM
#
# Cuándo corre:
#   - Push a la rama nextjs-migration
#   - PR hacia main
#   - Manual dispatch (con opción de especificar rama)
#
# Tests de admin requieren secretos opcionales:
#   TEST_ADMIN_EMAIL, TEST_ADMIN_PASSWORD
# Si no están configurados en el repo, esos tests se saltan automáticamente.

name: E2E Tests (Playwright)

on:
  push:
    branches:
      - nextjs-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a testear'
        default: 'nextjs-migration'
        required: false

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Instalar dependencias ───────────────────────────────────────────
      - name: Instalar dependencias npm
        run: npm ci

      # ── 4. Build Next.js ───────────────────────────────────────────────────
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # ── 5. Instalar browsers de Playwright ────────────────────────────────
      - name: Instalar Chromium
        run: npx playwright install chromium --with-deps

      # ── 6. Ejecutar tests E2E ──────────────────────────────────────────────
      - name: Ejecutar tests Playwright
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # Credenciales de admin (opcionales — tests se saltan si no están)
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      # ── 7. Publicar reporte HTML (en fallos) ─────────────────────────────
      - name: Subir reporte Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # ── 8. Subir capturas de fallo ────────────────────────────────────────
      - name: Subir capturas de pantalla y videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
