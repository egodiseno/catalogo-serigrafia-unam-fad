# Supabase local development config
# Docs: https://supabase.com/docs/guides/cli/config

[api]
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:8000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[functions]
# Edge Functions se despliegan con: supabase functions deploy create-admin-user

[functions.reset-user-password]
verify_jwt = false   # Acceso público: no requiere Bearer token del caller

[functions.search-obras]
verify_jwt = false   # Búsqueda pública del catálogo: no requiere autenticación
